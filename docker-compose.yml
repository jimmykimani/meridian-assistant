services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501,http://ui:8501"

  ui:
    build: .
    restart: unless-stopped
    command: >
      streamlit run ui.py
      --server.port=8501
      --server.address=0.0.0.0
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      MERIDIAN_API_URL: "http://api:8000"
    depends_on:
      - api
